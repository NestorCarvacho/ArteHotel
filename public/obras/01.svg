<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

    <rect width="1200" height="1500" fill="#c9bfb2"/>
    <rect width="1200" height="1500" fill="#b7ab9e"/>
    <ellipse cx="280" cy="420" rx="520" ry="380" fill="#f2d7a6" filter="url(#softer)" opacity="0.95"/>
    <polygon points="80,120 760,60 690,980 40,860" fill="#efd3a4" opacity="0.92"/>
    <polygon points="150,180 700,130 640,900 120,800" fill="#f7e2be" opacity="0.55"/>
    <rect x="210" y="150" width="8" height="720" fill="#6d645a" opacity="0.28"/>
    <rect x="430" y="90" width="7" height="800" fill="#6d645a" opacity="0.22"/>
    <rect y="1040" width="1200" height="460" fill="#a89888" opacity="0.55"/>
  
  <rect width="100%" height="100%" fill="url(#vig)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.34" style="mix-blend-mode:multiply"/>
</svg>