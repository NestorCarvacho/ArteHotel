<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

    <rect width="1600" height="1100" fill="#ddd4c6"/>
    <rect y="620" width="1600" height="480" fill="#3c2e27"/>
    <ellipse cx="820" cy="860" rx="640" ry="90" fill="#8d6244" filter="url(#soft)" opacity="0.8"/>
    <ellipse cx="560" cy="790" rx="150" ry="42" fill="#1d1410" opacity="0.35" filter="url(#soft)"/>
    <ellipse cx="520" cy="760" rx="118" ry="28" fill="#efe6da"/>
    <ellipse cx="980" cy="800" rx="70" ry="18" fill="#d8c8b4" opacity="0.8"/>
    <rect x="0" y="612" width="1600" height="3" fill="#cbbba6" opacity="0.7"/>
  
  <rect width="100%" height="100%" fill="url(#vig)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.34" style="mix-blend-mode:multiply"/>
</svg>