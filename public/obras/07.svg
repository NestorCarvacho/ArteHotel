<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

    <rect width="1200" height="1500" fill="#14110f"/>
    <ellipse cx="620" cy="1180" rx="520" ry="90" fill="#2a221c"/>
    <rect x="575" y="430" width="22" height="560" fill="#f7f3ea"/>
    <rect x="540" y="400" width="100" height="620" fill="#f0e2cc" filter="url(#soft)" opacity="0.75"/>
    <ellipse cx="640" cy="1040" rx="90" ry="22" fill="#f4efe4" opacity="0.35" filter="url(#soft)"/>
    <ellipse cx="700" cy="1120" rx="160" ry="28" fill="#000" opacity="0.35" filter="url(#soft)"/>
  
  <rect width="100%" height="100%" fill="url(#vig)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.34" style="mix-blend-mode:multiply"/>
</svg>